# Azizan VPN iOS: preserve the proven unsigned build.
workflows:
  azizan-ios:
    name: Azizan VPN iOS Debug
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      node: 22
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci
      - name: Install Go toolchain
        script: |
          brew install go@1.25
          echo "export PATH=\"$(brew --prefix go@1.25)/bin:\$PATH\"" >> "$CM_ENV"
          export PATH="$(brew --prefix go@1.25)/bin:$PATH"
          go version
      - name: Build Azizan VPN Capacitor iOS (unsigned)
        script: |
          npm run action client/capacitor/build ios

  azizan-ios-release:
    name: Azizan VPN iOS Release
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Azizan VPN
    environment:
      xcode: latest
      node: 22
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.azizanvpn.ios
      vars:
        DEVELOPMENT_TEAM: W74274K4FM
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci
      - name: Install Go toolchain
        script: |
          brew install go@1.25
          echo "export PATH=\"$(brew --prefix go@1.25)/bin:\$PATH\"" >> "$CM_ENV"
          export PATH="$(brew --prefix go@1.25)/bin:$PATH"
          go version
      - name: Prepare and synchronize iOS project
        script: |
          npm run action client/capacitor/build ios
      - name: Configure signing after Capacitor sync
        script: |
          xcode-project use-profiles
          test -f /Users/builder/export_options.plist
      - name: Archive signed release
        script: |
          mkdir -p "$CM_BUILD_DIR/output/client/ios"
          xcodebuild clean archive \
            -project client/capacitor/ios/App/App.xcodeproj \
            -scheme Outline \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath "$CM_BUILD_DIR/output/client/ios/Outline.xcarchive" \
            MARKETING_VERSION=1.0 \
            CURRENT_PROJECT_VERSION=6 \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM"
      - name: Export signed App Store IPA
        script: |
          mkdir -p "$CM_BUILD_DIR/output/client/ios/ipa"
          xcodebuild -exportArchive \
            -archivePath "$CM_BUILD_DIR/output/client/ios/Outline.xcarchive" \
            -exportPath "$CM_BUILD_DIR/output/client/ios/ipa" \
            -exportOptionsPlist /Users/builder/export_options.plist
    artifacts:
      - output/client/ios/ipa/*.ipa
      - output/client/ios/Outline.xcarchive
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
